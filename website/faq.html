      "@context": "https://schema.org",

      "mainEntity": [
        {
          "@type": "Question",
          "name": "How do I install Enhancer for PW?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Open Chrome Web Store, Firefox Add-ons, or Microsoft Edge Add-ons, search for 'Enhancer for Physics Wallah' (or click the Add to Browser button on our homepage), and click 'Add to Browser'. It starts working immediately on pw.live with zero login."
          }
        },
        {
          "@type": "Question",
          "name": "Why don't keyboard shortcuts work when I press them?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "By default, keyboard hotkeys (H to speed up, J to slow down, L to reset) are disabled when typing inside doubt boxes, search inputs, or notes to prevent accidental triggers. Also check if hotkeys are enabled in the extension popup."
          }
        },
        {
          "@type": "Question",
          "name": "Does Skip Silence record my audio or lectures?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. The extension uses the browser's Web Audio API purely in temporary RAM to measure volume. It never records, stores, or transmits any audio anywhere."
          }
        },
        {
          "@type": "Question",
          "name": "Can my Physics Wallah account get banned for using this extension?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. Enhancer for PW is a purely client-side video player controller. It does not tamper with server APIs, DRM, or unauthorized downloads. It simply adjusts playback speed, audio volume, and hides DOM clutter locally in your browser."
          }
        }
      ]
    }
